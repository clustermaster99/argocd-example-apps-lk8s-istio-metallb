apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: front-end-vs
spec:
  hosts:
  - "sc.clustermaster.com"
  gateways:
  - istio-system/clustermaster-gw
  http:
  - route:
    - destination:
        host: front-end.sockshop.svc.cluster.local
        port:
          number: 80